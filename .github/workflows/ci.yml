name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Unit, integration and browser tests
        run: python -m pytest -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentgate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration tests against PostgreSQL
        run: ./mvnw -B test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Builds every image so a broken Dockerfile fails CI, not a demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  eval-gate:
    # Runs the smoke subset of the eval suite against a real model and fails the
    # build if success drops versus the committed baseline.
    needs: python
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # the free tier is rate-limited, so 6 agent tasks take ~30 min
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AGENTGATE_MODEL: ${{ vars.AGENTGATE_MODEL || 'gemini:gemma-4-26b-a4b-it' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for model credentials
        id: creds
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY secret not set (or PR from a fork); skipping the eval gate."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.creds.outputs.available == 'true'
        run: |
          pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Run smoke eval
        if: steps.creds.outputs.available == 'true'
        run: python -m agentgate run --smoke --concurrency 2 --label "PR #${{ github.event.number }}" --out runs
      - name: Report
        if: steps.creds.outputs.available == 'true' && always()
        run: |
          {
            echo "## Eval smoke run"
            python -m agentgate report baselines/smoke.json runs/*/results.json 2>/dev/null || python -m agentgate report runs/*/results.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Regression gate
        if: steps.creds.outputs.available == 'true'
        run: |
          if [ ! -f baselines/smoke.json ]; then
            echo "::warning::No baseline yet. Commit runs/<id>/results.json as baselines/smoke.json to enable the gate."
            exit 0
          fi
          # 6 tasks: one task is ~17 pts, so this tolerates one flaky task but fails on two.
          python -m agentgate compare baselines/smoke.json runs/*/results.json --max-drop 20
      - name: Upload traces
        if: steps.creds.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-traces
          path: runs/
          retention-days: 14
